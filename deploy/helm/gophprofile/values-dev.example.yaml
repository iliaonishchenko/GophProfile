image:
  repository: gophprofile
  tag: latest
  pullPolicy: IfNotPresent

config:
  s3Endpoint: minio:9000
  publicBaseUrl: http://gophprofile.local
  otelEndpoint: jaeger:4317

# Create this Secret manually before installing the chart.
secret:
  existingSecret: gophprofile-secrets

server:
  replicaCount: 1
  autoscaling:
    enabled: false

worker:
  replicaCount: 1
  autoscaling:
    enabled: false

ingress:
  enabled: true
  host: gophprofile.local

monitoring:
  serviceMonitor:
    enabled: false

networkPolicy:
  enabled: false
