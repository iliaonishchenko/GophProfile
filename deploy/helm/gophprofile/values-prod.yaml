image:
  repository: ghcr.io/iliaonishchenko/gophprofile
  tag: "1.0.0"
  pullPolicy: IfNotPresent

config:
  s3Endpoint: minio.gophprofile.svc.cluster.local:9000
  s3UseSSL: false
  publicBaseUrl: https://avatars.example.com
  otelEndpoint: jaeger-collector.monitoring.svc.cluster.local:4317

secret:
  existingSecret: gophprofile-secrets

server:
  replicaCount: 2
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10

worker:
  replicaCount: 1
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 5

ingress:
  enabled: true
  className: nginx
  host: avatars.example.com
  tls:
    enabled: true
    secretName: avatars-example-com-tls

monitoring:
  serviceMonitor:
    enabled: true
    additionalLabels:
      release: prometheus

networkPolicy:
  enabled: true
  ingressNamespace: ingress-nginx
  monitoringNamespace: monitoring
  extraEgress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 4317
